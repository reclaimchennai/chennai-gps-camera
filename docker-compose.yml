# cam.reclaimchennai.city, as it actually runs.
#
# The published image carries the built app (see Dockerfile) and serves it
# with Caddy on :8080. The edge Caddy proxies cam.reclaimchennai.city to
# cam-app:8080 over the shared `web` network; no host port is published
# and nothing is mounted. deploy.sh builds the image and recreates this
# container — `CAM_VERSION=v1.46.0 docker compose up -d` does the same by
# hand.
#
# (This file used to describe a caddy:latest sidecar serving
# ./deploy/current through a bind mount. The live container stopped
# working that way, which left deploy.sh building releases nothing read.)
services:
  cam-app:
    image: reclaimchennai/chennai-gps-camera:${CAM_VERSION:-latest}
    container_name: cam-app
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true
